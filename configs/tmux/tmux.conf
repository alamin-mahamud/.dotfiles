# ~/.dotfiles/configs/tmux/tmux.conf
# tmux for heavy SSH + many concurrent agentic sessions.
# Design: one obvious binding per action, hairline mono theme, no powerline glyphs.
# Reload: prefix + r

# ---------------------------------------------------------------- terminal ---
# tmux-256color is the correct TERM to advertise inside tmux (ncurses-term).
# Truecolor is declared with terminal-features, not the legacy Tc override.
set -g  default-terminal "tmux-256color"

# One append, guarded. `set -as` really appends, so an unguarded line grows the
# list by one copy on every `prefix + r` (the old config did exactly that to
# terminal-overrides). The sentinel keeps re-sourcing idempotent; to change this
# list, edit it and restart the server (tmux kill-server) rather than reload.
#   RGB       24-bit colour
#   usstyle   undercurl / coloured underlines
#   clipboard OSC 52, the only clipboard that reaches the machine you SSH from
#   extkeys   CSI u extended keys -- the FEATURE is "extkeys"; "extended-keys"
#             is the option name, and tmux accepts it here silently and ignores it
%if "#{!=:#{@terminal_features_applied},1}"
  set -as terminal-features ",*:RGB:usstyle:clipboard:extkeys"
  set -g  @terminal_features_applied 1
%endif

# Carried over from the Catppuccin/Warp config this replaces: Warp is not one
# of the terminals tmux recognises, so it needs its TERM and clipboard spelled
# out. Inert over SSH, where TERM_PROGRAM is unset.
if-shell 'test "$TERM_PROGRAM" = "WarpTerminal"' {
  set -g default-terminal "xterm-256color"
}

# Extended (CSI u) keys: lets Shift-Enter / Ctrl-Enter reach Claude Code.
# "on" = only forwarded to apps that ask for them, so plain zsh stays clean.
# If Shift-Enter still does nothing, switch to "always" and add to ~/.zshrc:
#   bindkey '\e[13;2u' accept-line
set -s  extended-keys on

# Pass DCS/OSC through untouched: progress bars, notifications, image protocols.
set -g  allow-passthrough on
set -g  set-clipboard on

# ------------------------------------------------------------------ server ---
set -s  escape-time 10          # 0 breaks split ESC sequences on laggy SSH
set -s  focus-events on
set -g  history-limit 50000     # ~13 agent panes * 50k lines is cheap at 38G RAM
set -g  display-time 2000
set -g  display-panes-time 2000

# --------------------------------------------------------------- behaviour ---
set -g  prefix C-a
unbind C-b
bind-key C-a send-prefix

set -g  mouse on
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
setw -g mode-keys vi
set -g  status-keys emacs
set -g  repeat-time 400

setw -g aggressive-resize on    # size to the smallest *attached* client only
set -g  detach-on-destroy off   # killing a session hops to another, not to shell
set -g  destroy-unattached off

# Activity is the "an agent produced output" signal. Mark it in the status bar,
# never interrupt with a message overlay.
setw -g monitor-activity on
set -g  visual-activity off
set -g  visual-bell off
set -g  bell-action none

# Keep manual window names (lsp-forwarder, vip, ...) instead of letting the
# running command overwrite them; the status format fills in the directory for
# windows still carrying a generic name.
setw -g allow-rename off
setw -g automatic-rename off

# ------------------------------------------------------------------ keys -----
# Reload
bind r source-file ~/.tmux.conf \; display-message " tmux.conf reloaded"

# Splits and new windows inherit the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation: vim keys with prefix, Alt+arrows without.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Pane resize, repeatable.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r C-h previous-window
bind -r C-l next-window

bind Enter resize-pane -Z          # zoom toggle
bind Tab   last-window
bind b     break-pane -d           # park a pane as its own window
bind M     command-prompt -p "join pane from:" "join-pane -h -s '%%'"   # m stays mark-pane

# Kill with confirmation; prod agents should not die by fat finger.
bind x confirm-before -p "kill pane #P? (y/n)"   kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window
bind Q confirm-before -p "kill session #S? (y/n)" kill-session

# ------------------------------------------------------------- fuzzy jump ---
# prefix+Space : every window of every session, live pane preview
# prefix+g     : session picker
# prefix+o     : throwaway shell in the current directory
bind Space run-shell "~/.dotfiles/configs/tmux/scripts/tmux-jump window"
bind g     run-shell "~/.dotfiles/configs/tmux/scripts/tmux-jump session"
bind o     display-popup -E -w 80% -h 70% -d "#{pane_current_path}"

# prefix+T : tool popups, inherited from the config this replaces (which bound
# them to f/g/p/k -- g is the session picker here). One menu beats four letters.
bind T display-menu -T " tools " -x C -y C \
  "lazygit"  g "display-popup -E -w 90% -h 90% -d \"#{pane_current_path}\" lazygit" \
  "k9s"      k "display-popup -E -w 90% -h 90% k9s" \
  "btop"     b "display-popup -E -w 90% -h 90% btop" \
  "" \
  "shell here" s "display-popup -E -w 80% -h 70% -d \"#{pane_current_path}\""

# ------------------------------------------------------------- copy mode ----
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send -X copy-pipe-end-of-line-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down
bind / copy-mode \; command-prompt -i -p "search up:" "send -X search-backward-incremental '%%%'"
bind P choose-buffer -Z

# ------------------------------------------------------ nested tmux (SSH) ---
# F12 mutes this tmux so the keys belong to the tmux you SSHed in from.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#414868,bg=default" \;\
  set window-status-current-format "#[fg=#414868]#I #W" \;\
  if -F "#{pane_in_mode}" "send-keys -X cancel" \;\
  refresh-client -S
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-format \;\
  refresh-client -S

# ============================================================== theme =======
# Mono hairline. Bar sits on the terminal background; one teal accent,
# amber while the prefix is held, red for alerts.
#   idle   #565f89   active #c0caf5   accent #7dcfff
#   prefix #e0af68   alert  #f7768e   hairline #292e42
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "fg=#565f89,bg=default"
set -g status-left-length 40
set -g status-right-length 80

# Session chip: teal normally, amber while the prefix is live.
set -g status-left "#[fg=#{?client_prefix,#e0af68,#7dcfff},bold] #S #[default]"

set -g status-right "#[fg=#e0af68]#{?client_prefix,PREFIX  ,}#[fg=#565f89]#{?window_zoomed_flag,ZOOM  ,}#[fg=#565f89]%H:%M  #[fg=#414868]#{session_windows}w  "

# Window label, the part that matters with a dozen agents open.
# Claude Code writes its conversation topic into the terminal title, so tmux
# sees it as #{pane_title}:  "✳ Tmux configuration for SSH sessions".
# Priority:
#   1. that topic, with the leading glyph stripped
#   2. otherwise, a manually named window keeps its name (lsp-forwarder, vip)
#   3. otherwise, the pane's directory (a bare zsh/bash window)
# "*" after the label = unseen output from that window.
# Two clip widths: idle windows stay narrow so a dozen of them still fit on
# one line, the focused one gets room to read.
set -g @wstrip "#{s|^[✳⏺⏵✕] *||:#{pane_title}}"
set -g @wgeneric "#{||:#{||:#{m:claude,#{window_name}},#{m:zsh,#{window_name}}},#{||:#{m:bash,#{window_name}},#{m:node,#{window_name}}}}"
set -g @wfallback "#{?#{E:@wgeneric},#{b:pane_current_path},#{window_name}}"
set -g @wlabel  "#{?#{m:✳*,#{pane_title}},#{=/14/…:#{E:@wstrip}},#{=/14/…:#{E:@wfallback}}}"
set -g @wlabelc "#{?#{m:✳*,#{pane_title}},#{=/28/…:#{E:@wstrip}},#{=/28/…:#{E:@wfallback}}}"

# Adaptive width: up to 5 windows every label is shown; past that the idle
# windows collapse to bare indices so a 13-window session still fits the 121
# columns this client actually has, and the focused topic stays readable.
# prefix+Space is the tool for reading the rest.
# NOTE: #{<=:13,5} is TRUE in tmux -- those operators compare as STRINGS, not
# numbers ("13" sorts before "5"). Hence the subtraction and the sign test,
# which are genuinely numeric.
set -g @wmany "#{m:-*,#{e|-|:5,#{session_windows}}}"
set -g @widle "#{?#{E:@wmany},, #{E:@wlabel}}"

setw -g window-status-separator "  "
setw -g window-status-style "fg=#565f89,bg=default"
setw -g window-status-format "#[fg=#414868]#I#[fg=#565f89]#{E:@widle}#[fg=#e0af68]#{?window_activity_flag,*,}"
setw -g window-status-current-style "fg=#c0caf5,bg=default,bold"
setw -g window-status-current-format "#[fg=#7dcfff]#I #[fg=#c0caf5,bold,underscore]#{E:@wlabelc}#[default]"
setw -g window-status-activity-style "fg=#e0af68,bg=default"
setw -g window-status-bell-style "fg=#f7768e,bg=default,bold"

# Hairline borders, no title bars.
set -g pane-border-lines single
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7dcfff"
set -g pane-border-status off

set -g message-style "fg=#7dcfff,bg=default,bold"
set -g message-command-style "fg=#e0af68,bg=default,bold"
set -g mode-style "fg=#1a1b26,bg=#7dcfff,bold"
set -g copy-mode-match-style "fg=#1a1b26,bg=#e0af68"
set -g copy-mode-current-match-style "fg=#1a1b26,bg=#7dcfff,bold"

set -g popup-border-lines rounded
set -g popup-style "bg=default"
set -g popup-border-style "fg=#414868"

set -g clock-mode-colour "#7dcfff"
set -g clock-mode-style 24

# ============================================================= plugins ======
# Deliberately short. Everything tmux-sensible would set is already set
# explicitly above, so the plugin is gone; tmux-copycat is gone (search is
# built in since 2.4); tokyonight.nvim is gone (a Neovim plugin tmux never
# read); tmux-yank is gone, and that one is a fix, not just tidying: this box
# has xclip/xsel and DISPLAY=:99 (Xvfb), so tmux-yank prefers the X clipboard
# and copies land in a headless Xvfb nobody can paste from. Native
# `set-clipboard on` + copy-pipe emits OSC 52 to the terminal you SSHed from,
# which is the clipboard you actually want.
# What is left is the one thing with real value here: session persistence.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# prefix + C-s saves now, prefix + C-r restores (resurrect's own bindings).
# Saves land in ~/.local/share/tmux/resurrect (XDG), not ~/.tmux/resurrect.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tpm stays last. tmux-continuum PREPENDS its save hook to status-right when it
# loads, so nothing below may touch status-right or auto-save silently stops.
run '~/.tmux/plugins/tpm/tpm'
